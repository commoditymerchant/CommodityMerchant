# Static site — no build step. Publish the repo root.
[build]
  publish = "."

# The functions directory has to live here rather than being passed on the
# command line, because two separate things deploy this site:
#   * cm-tools/letters/publish_site.py, run by hand when a letter goes out
#   * .github/workflows/update-prices.yml, on a 2-hourly weekday cron
# Both call `netlify deploy --prod --dir .`, and neither passes --functions. If
# the directory were only known to one of them, the next price deploy would
# publish a site with no functions and quietly delete the Gumroad → Meta bridge
# between sales, which is the kind of failure nobody notices until the campaign
# numbers are already wrong.
[functions]
  directory = "netlify/functions"

# Printed-URL destinations. The book and the site print commoditymerchant.net
# paths that are not pages. Without these they 404, and a reader who types what
# is printed on p53 of the career book lands nowhere.
#
# The src tag is site-* rather than career-*, deliberately: a click on a
# hyperlink inside the book carries src=career-guide, a typed URL carries
# src=site-guide. Both are attributed; they answer different questions.
# See strategy/cta-links-canonical.md in the Claude project folder.
[[redirects]]
  from = "/guide"
  to = "https://merchantmind5.gumroad.com/l/mnwiyt?src=site-guide"
  status = 301
  force = true

[[redirects]]
  from = "/letter"
  to = "https://commoditymerchant.substack.com"
  status = 301
  force = true
