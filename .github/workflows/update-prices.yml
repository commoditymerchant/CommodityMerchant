name: Update commodity prices

on:
  schedule:
    # Weekdays at 21:30 UTC, after US/European market close
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch latest prices
        run: node scripts/update-prices.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- api/prices; then
            echo "No price changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/prices
          git commit -m "Update commodity prices ($(date -u +%Y-%m-%d))"
          git push
